services:
  # Backend Service (FastAPI on Render)
  - type: web
    name: financeapp-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        scope: all
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://financeapp-frontend.vercel.app,https://www.financeapp-frontend.vercel.app
        scope: all
      - key: SECRET_KEY
        scope: all
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: COOKIE_SECURE
        value: "true"

  # Frontend Service (Vite/React on Vercel - configured in vercel.json)
  # Note: Frontend is deployed to Vercel, not Render
