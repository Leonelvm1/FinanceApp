# Alembic configuration file
# -------------------------
# This file is intentionally minimal. The actual DB URL is injected
# at runtime by env.py using your backend's configuration (configuration.py).
#
# If you ever need a hard-coded dev URL for quick local tests, replace
# sqlalchemy.url below. For Docker / CI, prefer setting environment variables
# and letting env.py read them from your backend configuration.

[alembic]
# path to migration scripts (relative to this file)
script_location = alembic

# A placeholder URL. env.py will override this with the backend connection.
# If you want a hardcoded dev URL, update the value below (not recommended for production).
sqlalchemy.url = driver://user:pass@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
